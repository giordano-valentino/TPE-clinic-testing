services:
  db:
    image: mysql:8.0
    container_name: mysql-clinic
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Grupo_7
      MYSQL_USER: progra_c
      MYSQL_PASSWORD: progra_c
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
